<!DOCTYPE html>
<html>
  <head>
    <title>Rock PaperScissors</title>

    <style>
      body {
        background-color: rgb(25, 25, 25);
        color: white;
        font-family: Arial;
      }

      .title{
        font-size: 30px;
        font-weight: bold;


      }

      .move-icon{
        height: 50px;
      }

      .move-button{
        background-color: transparent;
        /* border: none; */
        border-radius: 60px;
        border: 3px solid white;
        width: 120px;
        height:120px;
        margin-right: 10px;
        cursor: pointer;

      }

      .reset-button{
        font-family: Arial;
        font-size: 15px;
        /* font-weight: bold; */
      }
      .result{
        font-size: 25px;
        font-weight: bold;
        margin-top: 15px;
      }

      .score{
        margin-top: 60px;
      }

      .reset-score-button{
        background-color: white;
        border: none;
        font-size: 15px;
        padding: 8px 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>

    <button onclick="
      playGame('Rock');
    " class="move-button"><img src="images/rock-emoji.png" class="move-icon"></button>

    <button onclick="
      playGame('Paper');
    " class="move-button"><img src="images/paper-emoji.png" class="move-icon"></button>

    <button onclick="
      playGame('Scissors');
    " class="move-button"><img src="images/paper-emoji.png" class="move-icon"></button>

    <p class="js-result result">You win.</p>
    <p class="js-move">
      You <img src="images/rock-emoji.png" class="move-icon">
      <img src="images/scissors-emoji.png" class="move-icon">
      computer
    </p>
    <p class="js-score score"></p>

    <button onclick="
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      localStorage.removeItem('score');
      updateScoreElement();
      "class="reset-score-button">Reset Score</button>

    

    <script>
      let score = JSON.parse(localStorage.getItem('score')) || {
            wins: 0,
            losses: 0,
            ties: 0
         };

      function playGame(playerMove){
        const  computerMove= pickComputerMove();
    
  
      let result = '';

      if (playerMove ==='Scissors'){
        if(computerMove === 'Rock'){
         result =  'You lose.';

        }else if(computerMove === 'Paper'){
          result = 'You win.';

        }else if(computerMove === 'Scissors'){
          result = 'Tie.';
        }
      }
      
      else if (playerMove ==='Paper'){
        if(computerMove === 'Rock'){
         result =  'You win.';

        }else if(computerMove === 'Paper'){
          result = 'Tie.';

        }else if(computerMove === 'Scissors'){
          result = 'You Lose.';

        }
      }

      else if (playerMove === 'Rock'){
          if(computerMove === 'Rock'){
         result =  'Tie.';

          }else if(computerMove === 'Paper'){
            result = 'You lose.';

          }else if(computerMove === 'Scissors'){
            result = 'You win.';

          }
      }
      
      if(result === 'You win.'){
        score.wins +=1;
      } else if(result ==='You lose.'){
        score.losses +=1;
      } else if(result === 'Tie.'){
        score.ties += 1;
      }

      localStorage.setItem('score',JSON.stringify(score));

       updateScoreElement();

        document.querySelector('.js-result').
        innerHTML = result;

        document.querySelector('.js-move').
        innerHTML = `You ${playerMove} - ${computerMove} Computer`;



      alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}
Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
      }

      function updateScoreElement(){
        document.querySelector('.js-score')
            .innerHTML = `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;

      }

      function pickComputerMove(){
          const randomNumber = (Math.random());

          let computerMove = '';
          if(randomNumber >= 0 && randomNumber<1/3){
            computerMove = 'Rock';
          }else if(randomNumber >= 1/3 && randomNumber <2/3){
            computerMove = 'Paper';
          }else if(randomNumber >= 2/3 && randomNumber < 1){
            computerMove ='Scissors';

          }

          return computerMove;
      }
     
    </script>

  </body>
</html>
